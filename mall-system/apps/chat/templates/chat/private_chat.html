<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与 {{ other_user.username }} 的聊天</title>
    <link rel="stylesheet" type="text/css" href="{% static 'chat/private_chat.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-log {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }

        .chat-message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .chat-message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
        }

        .chat-message .content {
            background-color: #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 70%;
            position: relative;
        }

        .chat-message .content::after {
            content: '';
            position: absolute;
            top: 10px;
            left: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 8px 0;
            border-color: transparent #e9ecef transparent transparent;
        }

        .chat-message .timestamp {
            font-size: 12px;
            color: gray;
            margin-top: 5px;
        }

        .chat-input-container {
            display: flex;
            padding: 15px;
            background-color: #f4f4f4;
        }

        #chat-content {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-right: 10px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        .delete-button {
            color: red;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 聊天标题 -->
        <div class="chat-header">
            与 {{ other_user.username }} 的聊天
        </div>

        <!-- 聊天记录 -->
        <div class="chat-log">
            {% for msg in messages %}
                <div class="chat-message">
                    <div class="avatar">{{ msg.sender.username|slice:":1"|upper }}</div>
                    <div>
                        <div class="content">
                            <b>{{ msg.sender.username }}：</b> {{ msg.content }}
                        </div>
                        <div class="timestamp">{{ msg.timestamp|date:"Y-m-d H:i" }}</div>
                        <form method="post" action="{% url 'delete_private_message' msg.id %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="delete-button">删除</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-container">
            <form method="post" action="{% url 'send_private_message' %}" style="display: flex; width: 100%;">
                {% csrf_token %}
                <input type="hidden" name="receiver_id" value="{{ other_user.id }}">
                <textarea id="chat-content" name="content" rows="2" placeholder="请输入消息内容"></textarea>
                <button type="submit">发送</button>
            </form>
        </div>
    </div>
</body>
</html>
