<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script>
        const roomName = "{{ room_name }}";  // 获取房间名
        const user = "{{ user_username }}";  // 当前用户
        const socket = new WebSocket('ws://' + window.location.host + '/ws/chat/private/' + roomName + '/');

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const messageDiv = document.createElement('div');
            messageDiv.textContent = `${data.timestamp} ${data.user}: ${data.message}`;
            document.getElementById('messages').appendChild(messageDiv);
        };

        function sendMessage() {
            const content = document.getElementById('message-input').value;
            socket.send(JSON.stringify({
                'action': 'send',
                'content': content,
            }));
            document.getElementById('message-input').value = '';
        }
    </script>
</head>
<body>
    <div>
        <h1>Private Chat with {{ admin_username }}</h1>
        <div id="messages"></div>
        <textarea id="message-input" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
</body>
</html>
