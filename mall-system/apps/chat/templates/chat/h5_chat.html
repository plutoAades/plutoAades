<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 聊天室</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .chat-container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #007bff;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
        }
        .chat-message {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #007bff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin-right: 8px;
        }
        .content {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 70vw;
            word-break: break-all;
            position: relative;
        }
        .chat-message.user .content {
            background: #007bff;
            color: #fff;
        }
        .timestamp {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        .actions {
            margin-left: 5px;
            display: flex;
            gap: 5px;
        }
        .actions button {
            background: none;
            border: none;
            color: #007bff;
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
        }
        .chat-input-area {
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #f4f4f4;
            border-top: 1px solid #eee;
        }
        .chat-input-row {
            display: flex;
            gap: 5px;
        }
        .chat-input-row input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
        }
        .chat-input-row button {
            padding: 8px 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        .chat-input-row button:active {
            background: #0056b3;
        }
        .chat-input-row input[type="file"] {
            font-size: 13px;
        }
        img.chat-img {
            max-width: 150px;
            border-radius: 6px;
            margin-top: 4px;
        }
        a.chat-file {
            color: #007bff;
            text-decoration: underline;
            font-size: 13px;
            margin-top: 4px;
            display: inline-block;
        }
        .revoked {
            color: red;
            font-size: 12px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">H5 聊天室</div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input-area">
            <div class="chat-input-row">
                <input type="text" id="chat-message-input" placeholder="输入消息..." autocomplete="off">
                <button id="chat-message-send">发送</button>
            </div>
            <div class="chat-input-row">
                <label for="chat-file-input" style="font-size:13px; margin-right:5px;">选择文件：</label>
                <input type="file" id="chat-file-input" accept="image/*,application/*" title="请选择要发送的文件" placeholder="选择文件">
                <button id="chat-file-send">发送文件</button>
            </div>
        </div>
    </div>
    <script>
        // 假设后端已注入当前用户名
        const username = "{{ request.user.username|default:'游客' }}";
        const roomType = "group"; // 或 "private"
        const roomName = "test"; // 实际项目可从URL获取
        const chatLog = document.getElementById('chat-log');
        let ws;

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.className = 'chat-message' + (msg.user === username ? ' user' : '');
            div.innerHTML = `
                <div class="avatar">${msg.user ? msg.user.charAt(0).toUpperCase() : '?'}</div>
                <div>
                    <div class="content">
                        ${msg.message_type === 'text' ? msg.message : ''}
                        ${msg.message_type === 'image' ? `<img src="${msg.file_url}" class="chat-img" />` : ''}
                        ${msg.message_type === 'file' ? `<a href="${msg.file_url}" class="chat-file" download>下载文件</a>` : ''}
                        ${msg.is_revoked ? `<span class="revoked">（已撤回）</span>` : ''}
                    </div>
                    <div class="timestamp">${msg.timestamp || ''}</div>
                    <div class="actions">
                        ${msg.user === username && !msg.is_revoked ? `<button onclick="revokeMsg(${msg.id})">撤回</button>` : ''}
                        ${msg.user === username ? `<button onclick="deleteMsg([${msg.id}])">删除</button>` : ''}
                        <button onclick="forwardMsg(${msg.id})">转发</button>
                    </div>
                </div>
            `;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function addMessage(msg) {
            renderMessage(msg);
        }

        function revokeMsg(id) {
            ws.send(JSON.stringify({ action: 'revoke', id }));
        }

        function deleteMsg(ids) {
            ws.send(JSON.stringify({ action: 'delete', ids }));
        }

        function forwardMsg(id) {
            ws.send(JSON.stringify({ action: 'forward', id }));
        }

        // WebSocket连接
        ws = new WebSocket(`ws://${location.host}/ws/chat/${roomType}/${roomName}/`);
        ws.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.action === 'revoke') {
                // 撤回消息
                const msgs = chatLog.querySelectorAll('.chat-message');
                msgs.forEach(msgDiv => {
                    if (msgDiv.innerHTML.includes(`revokeMsg(${data.id})`)) {
                        msgDiv.querySelector('.revoked')?.remove();
                        const contentDiv = msgDiv.querySelector('.content');
                        contentDiv.innerHTML += `<span class="revoked">（已撤回）</span>`;
                    }
                });
            } else if (data.action === 'delete') {
                // 删除消息
                const msgs = chatLog.querySelectorAll('.chat-message');
                msgs.forEach(msgDiv => {
                    data.ids.forEach(id => {
                        if (msgDiv.innerHTML.includes(`deleteMsg([${id}])`)) {
                            msgDiv.remove();
                        }
                    });
                });
            } else {
                addMessage(data);
            }
        };

        // 发送文本消息
        document.getElementById('chat-message-send').onclick = function() {
            const input = document.getElementById('chat-message-input');
            const message = input.value.trim();
            if (message) {
                ws.send(JSON.stringify({
                    action: 'send',
                    message_type: 'text',
                    content: message
                }));
                input.value = '';
            }
        };

        // 发送文件/图片消息
        document.getElementById('chat-file-send').onclick = function() {
            const fileInput = document.getElementById('chat-file-input');
            const file = fileInput.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            // 上传文件到后端API，拿到文件URL后通过ws发送
            fetch('/api/chat/messages/upload/', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                ws.send(JSON.stringify({
                    action: 'send',
                    message_type: file.type.startsWith('image/') ? 'image' : 'file',
                    file_url: data.url
                }));
                fileInput.value = '';
            });
        };
    </script>
</body>
</html>
