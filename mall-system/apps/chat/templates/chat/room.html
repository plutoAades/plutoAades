<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室：{{ room_name }}</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 聊天容器 */
        .chat-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            height: 90vh;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* 聊天记录区域 */
        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* 单条消息样式 */
        .chat-message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
        }

        .chat-message.user .avatar {
            margin-left: 10px;
            margin-right: 0;
            background-color: #6c757d;
        }

        .chat-message .content {
            background-color: #e9ecef;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 60%;
            position: relative;
        }

        .chat-message.user .content {
            background-color: #007bff;
            color: white;
        }

        .chat-message .content::after {
            content: '';
            position: absolute;
            top: 10px;
            left: -10px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 10px 10px 0;
            border-color: transparent #e9ecef transparent transparent;
        }

        .chat-message.user .content::after {
            left: auto;
            right: -10px;
            border-width: 10px 0 10px 10px;
            border-color: transparent transparent transparent #007bff;
        }

        .chat-message .timestamp {
            font-size: 12px;
            color: gray;
            margin-top: 5px;
        }

        /* 输入区域 */
        .chat-input-container {
            display: flex;
            padding: 15px;
            background-color: #f4f4f4;
            border-top: 1px solid #ddd;
        }

        #chat-message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-right: 10px;
        }

        #chat-message-submit {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #chat-message-submit:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .chat-container {
                margin: 10px;
                height: 95vh;
            }

            .chat-message .content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- 聊天容器 -->
    <div class="chat-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            聊天室：{{ room_name }}
        </div>

        <!-- 聊天记录 -->
        <div id="chat-log"></div>

        <!-- 输入区域 -->
        <div class="chat-input-container">
            <input id="chat-message-input" type="text" placeholder="输入消息..." title="输入消息">
            <button id="chat-message-submit">发送</button>
        </div>
    </div>

    <script>
        const roomName = "{{ room_name }}";
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const chatSocket = new WebSocket(
            wsScheme + '://' + window.location.host + '/ws/chat/' + roomName + '/'
        );

        // 接收消息
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const log = document.getElementById('chat-log');
            const now = new Date().toLocaleTimeString(); // 当前时间
            const isUser = data.user === "{{ request.user.username }}"; // 判断是否是当前用户
            log.innerHTML += `
                <div class="chat-message ${isUser ? 'user' : ''}">
                    ${!isUser ? `<div class="avatar">${data.user.charAt(0).toUpperCase()}</div>` : ''}
                    <div>
                        <div class="content">
                            ${isUser ? '' : `<b>${data.user}：</b>`} ${data.message}
                        </div>
                        <div class="timestamp">${now}</div>
                    </div>
                    ${isUser ? `<div class="avatar">${data.user.charAt(0).toUpperCase()}</div>` : ''}
                </div>`;
            log.scrollTop = log.scrollHeight; // 滚动到底部
        };

        // 关闭 WebSocket
        chatSocket.onclose = function(e) {
            console.error('WebSocket 连接已关闭');
        };

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('chat-message-input');
            const message = input.value.trim();
            if (message) {
                chatSocket.send(JSON.stringify({ 'message': message }));
                input.value = ''; // 清空输入框
            }
        }

        // 点击发送按钮
        document.getElementById('chat-message-submit').onclick = sendMessage;

        // 按回车键发送消息
        document.getElementById('chat-message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
