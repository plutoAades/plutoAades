<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .register-container {
            background: #fff;
            max-width: 400px;
            margin: 60px auto;
            padding: 40px 30px 30px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(60, 120, 200, 0.15);
        }
        .register-container h2 {
            text-align: center;
            color: #3a7bd5;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .register-container form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
        }
        .form-row label {
            flex: 0 0 80px;
            margin-right: 8px;
            font-size: 15px;
            color: #333;
        }
        .form-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-row input:focus {
            border-color: #3a7bd5;
            outline: none;
        }
        .hint-icon {
            display: inline-block;
            color: #ff9800;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            position: relative;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            border-radius: 50%;
            background: #fffbe7;
            border: 1px solid #ffe082;
            transition: background 0.2s, color 0.2s;
        }
        .hint-icon:after {
            content: "！";
        }
        .hint-text {
            display: none;
            position: absolute;
            left: 36px;
            top: 50%;
            transform: translateY(-50%);
            background: #fffbe7;
            color: #333;
            border: 1px solid #ffe082;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(60,120,200,0.12);
            min-width: 180px;
        }
        .form-row:hover .hint-icon + .hint-text,
        .form-row:focus-within .hint-icon + .hint-text {
            display: block;
        }
        .register-container button {
            background: linear-gradient(90deg, #3a7bd5 0%, #00d2ff 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .register-container button:hover {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
        }
        .register-container .login-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #3a7bd5;
            text-decoration: none;
            font-size: 15px;
        }
        .register-container .login-link:hover {
            text-decoration: underline;
        }
        .register-container .errorlist {
            color: #e53935;
            margin-bottom: 10px;
            list-style: none;
            padding-left: 0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>用户注册</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label for="{{ form.username.id_for_label }}">用户名：</label>
                {{ form.username }}
                <span class="hint-icon" tabindex="0"></span>
                <span class="hint-text">请输入4-20位用户名，仅支持字母、数字或下划线</span>
            </div>
            <div class="form-row">
                <label for="{{ form.password1.id_for_label }}">密码：</label>
                {{ form.password1 }}
                <span class="hint-icon" tabindex="0"></span>
                <span class="hint-text">密码长度至少8位，需包含字母和数字</span>
            </div>
            <div class="form-row">
                <label for="{{ form.password2.id_for_label }}">确认密码：</label>
                {{ form.password2 }}
                <span class="hint-icon" tabindex="0"></span>
                <span class="hint-text">请再次输入密码</span>
            </div>
            <div class="form-row">
                <label for="{{ form.phone.id_for_label }}">手机号：</label>
                {{ form.phone }}
                <span class="hint-icon" tabindex="0"></span>
                <span class="hint-text">请输入有效的手机号（可选）</span>
            </div>
            <button type="submit">注册</button>
        </form>
        <a class="login-link" href="{% url 'login' %}">已有账号？去登录</a>
    </div>
    <script>
        // 让输入框聚焦时显示提示
        document.querySelectorAll('.form-row input').forEach(function(input) {
            input.addEventListener('focus', function() {
                var hint = input.parentElement.querySelector('.hint-text');
                if(hint) hint.style.display = 'block';
            });
            input.addEventListener('blur', function() {
                var hint = input.parentElement.querySelector('.hint-text');
                if(hint) hint.style.display = 'none';
            });
        });
        // 鼠标悬停感叹号也显示提示
        document.querySelectorAll('.hint-icon').forEach(function(icon) {
            icon.addEventListener('mouseenter', function() {
                var hint = icon.nextElementSibling;
                if(hint) hint.style.display = 'block';
            });
            icon.addEventListener('mouseleave', function() {
                var hint = icon.nextElementSibling;
                if(hint) hint.style.display = 'none';
            });
        });
    </script>
</body>
</html>
