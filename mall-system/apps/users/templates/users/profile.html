<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料</title>
</head>
<body>
    <h1>个人资料</h1>
    <p>用户名：{{ user.username }}</p>

    <p>注册时间：{{ user.date_joined|date:"Y-m-d H:i" }}</p>
    <a href="{% url 'logout' %}">退出登录</a>
</body>
</html>
