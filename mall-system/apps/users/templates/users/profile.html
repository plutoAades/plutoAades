<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f4f4;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #232e3c;
            color: #fff;
            padding-top: 30px;
            flex-shrink: 0;
            box-shadow: 2px 0 8px rgba(0,0,0,0.04);
        }
        .sidebar h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .menu-group {
            margin-bottom: 24px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            margin-bottom: 6px;
            border-radius: 6px;
            font-size: 16px;
            transition: background 0.2s;
        }
        .sidebar a.active, .sidebar a:hover {
            background: #007bff;
        }
        .sidebar .icon {
            margin-right: 12px;
            font-size: 18px;
        }
        .main {
            flex: 1;
            padding: 40px 32px;
            background: #fff;
        }
        @media (max-width: 700px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; padding: 10px 0; box-shadow: none; }
            .sidebar h2 { margin-bottom: 10px; }
            .sidebar a { margin: 0 4px 0 0; padding: 10px 8px; border-radius: 4px; font-size: 15px;}
            .main { padding: 16px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h2>账号中心</h2>
            <div class="menu-group">
                <a href="{% url 'profile' %}" class="active"><span class="icon">👤</span>个人资料</a>
                <a href="{% url 'dashboard' %}"><span class="icon">🛒</span>商品列表</a>
                <a href="{% url 'order_list' %}"><span class="icon">📦</span>我的订单</a>
                {# <a href="{% url 'chat_room_list' %}"><span class="icon">💬</span>聊天室</a> #}
            </div>
            <div class="menu-group">
                <a href="{% url 'logout' %}"><span class="icon">🚪</span>退出登录</a>
            </div>
        </nav>
        <div class="main">
            <h1>个人资料</h1>
            <p>用户名：{{ user.username }}</p>
            <p>邮箱：{{ user.email }}</p>
            <p>注册时间：{{ user.date_joined|date:"Y-m-d H:i" }}</p>
            <div class="card" style="margin-top:16px;">
                <h3 style="margin:0 0 10px 0;">为您推荐</h3>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    {% for p in recommended_products %}
                        <div style="width:220px;background:#fff;border-radius:8px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,0.04);">
                            <a href="{% url 'product_detail' p.id %}" style="text-decoration:none;color:inherit;">
                                {% if p.images.first %}
                                    <img src="{{ p.images.first.image.url }}" alt="{{ p.name }}" style="width:100%;height:130px;object-fit:cover;border-radius:6px;">
                                {% else %}
                                    <img src="https://via.placeholder.com/220x130?text=暂无图片" alt="暂无图片" style="width:100%;height:130px;object-fit:cover;border-radius:6px;">
                                {% endif %}
                                <div style="margin-top:8px;font-weight:600;">{{ p.name }}</div>
                                <div style="color:#3a7bd5;font-weight:700;margin-top:6px;">￥{{ p.price }}</div>
                            </a>
                        </div>
                    {% empty %}
                        <div style="color:#666;">暂无推荐商品</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
